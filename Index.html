<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MICKEY HACK PREMIUM V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --premium-gold: #FFD700;
            --fixer-red: #FF416C;
            --panel-bg: rgba(6, 6, 6, 0.98);
            --neon-blue: #00f2fe;
            --neon-purple: #7000ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Orbitron', sans-serif; }

        body, html { height: 100%; width: 100%; background: #000; overflow: hidden; color: white; }

        /* ===== ENTRY SCREEN ===== */
        #entry-screen {
            position: fixed; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('mickey.png') no-repeat center center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }

        .premium-title {
            font-size: 32px; font-weight: 900; color: #fff;
            text-shadow: 0 0 15px var(--neon-purple);
            letter-spacing: 3px; text-transform: uppercase; text-align: center;
        }

        .main-btn {
            margin-top: 30px; padding: 15px 40px; font-size: 18px; font-weight: bold; color: white;
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
            transition: 0.3s;
        }

        /* ===== GAME FRAME ===== */
        #game-frame { display: none; width: 100%; height: 100%; border: none; }

        /* ===== FLOATING CIRCLE BUTTON ===== */
        #floating-circle {
            display: none; position: fixed; top: 70%; right: 20px;
            width: 70px; height: 70px; z-index: 10000; cursor: move;
            touch-action: none; border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            background: url('flot.png') no-repeat center center/cover;
            border: 2px solid var(--neon-blue);
            justify-content: center; align-items: center;
        }

        /* ===== NEW PREDICTION RESULT BOX ===== */
        #prediction-result-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88vw;
            max-width: 380px;
            aspect-ratio: 9/11;
            border-radius: 18px;
            overflow: hidden;
            z-index: 10001;
            box-shadow: 0 0 40px rgba(120, 0, 255, 0.8), 0 0 80px rgba(120, 0, 255, 0.3);
            border: 2px solid rgba(180, 80, 255, 0.5);
        }

        /* Background Video */
        #prediction-video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            border-radius: 18px;
        }

        /* Overlay gradient for text readability */
        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.55) 0%,
                rgba(0,0,0,0.1) 30%,
                rgba(0,0,0,0.1) 60%,
                rgba(0,0,0,0.45) 100%
            );
            z-index: 1;
        }

        /* Top Header: PREDICTION RESULT */
        .pred-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 14px;
        }

        .pred-header-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pred-header-title .word-prediction {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .pred-header-title .word-result {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 22px rgba(0,255,136,0.5);
        }

        /* Info Row: WinGo 1 Min | Period Number */
        .pred-info-row {
            position: absolute;
            top: 52px; left: 0; right: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        .pred-info-left {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            letter-spacing: 1px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .pred-info-right {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Bottom Result Label */
        .pred-result-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 22px;
        }

        .pred-result-label {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.85);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .pred-result-value {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1;
            /* Neon glow will be set dynamically */
        }

        .pred-result-value.big {
            color: #ff6cff;
            text-shadow: 
                0 0 10px #ff00ff,
                0 0 25px #ff00ff,
                0 0 50px #cc00cc,
                0 0 80px rgba(200,0,200,0.4);
        }

        .pred-result-value.small {
            color: #cc88ff;
            text-shadow: 
                0 0 10px #aa44ff,
                0 0 25px #aa44ff,
                0 0 50px #7700cc,
                0 0 80px rgba(120,0,200,0.4);
        }

        /* Close button */
        .pred-close-btn {
            position: absolute;
            top: 10px; right: 12px;
            z-index: 3;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Analyzing animation */
        .analyzing-pulse {
            animation: pulse-glow 0.8s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.5; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1.04); }
        }

        /* Panel open animation */
        @keyframes panelOpen {
            from { opacity: 0; transform: translate(-50%, -48%) scale(0.92); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        #prediction-result-panel.show {
            animation: panelOpen 0.3s ease forwards;
        }

        /* ===== PAYMENT BOX ===== */
        #payment-box {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 340px; background: #111; border: 2px solid gold; z-index: 10005; 
            padding: 20px; text-align: center; border-radius: 10px;
        }

        .qr-img { width: 200px; height: 200px; margin: 15px 0; border: 3px solid #fff; }

        .loading-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <!-- Entry Screen -->
    <div id="entry-screen">
        <div class="premium-title">MICKEY ADVANCE</div>
        <p style="color: cyan; font-size: 12px; margin-top: 5px;">PREMIUM V2.0 SYSTEM</p>
        <button class="main-btn" onclick="startApp()">LOGIN & ACTIVATE</button>
    </div>

    <!-- Game iFrame -->
    <iframe id="game-frame" src=""></iframe>

    <!-- Floating Circle Button -->
    <div id="floating-circle">
        <i class="fas fa-bolt" style="color: cyan; font-size: 25px;"></i>
    </div>

    <!-- ===== NEW PREDICTION RESULT BOX ===== -->
    <div id="prediction-result-panel">

        <!-- Background Video -->
        <video id="prediction-video-bg" autoplay muted loop playsinline>
            <source id="video-source" src="small.mp4" type="video/mp4">
        </video>

        <!-- Overlay -->
        <div class="video-overlay"></div>

        <!-- Close Button -->
        <div class="pred-close-btn" onclick="toggleMickeyPanel()">
            <i class="fas fa-times"></i>
        </div>

        <!-- Top: PREDICTION RESULT heading -->
        <div class="pred-header">
            <div class="pred-header-title">
                <span class="word-prediction">PREDICTION</span>
                <span class="word-result">RESULT</span>
            </div>
        </div>

        <!-- Info Row: WinGo 1 Min | Period -->
        <div class="pred-info-row">
            <span class="pred-info-left">WinGo 1 Min</span>
            <span class="pred-info-right" id="game-period-display">#LOADING...</span>
        </div>

        <!-- Bottom: PREDICTION RESULT value -->
        <div class="pred-result-bottom">
            <div class="pred-result-label">PREDICTION RESULT</div>
            <div class="pred-result-value small" id="pred-result-text">WAIT...</div>
        </div>

    </div>

    <!-- Payment Box -->
    <div id="payment-box">
        <h3 style="color: gold;">ACTIVATE PREMIUM</h3>
        <img src="qr.png" alt="Scan QR" class="qr-img">
        <p>Activation Fee: ₹199</p>
        <input type="text" id="utr" style="width:100%; padding:10px; margin:10px 0; background:#000; color:#fff; border:1px solid #444;" placeholder="Enter Ref/UTR No.">
        <button class="main-btn" style="width:100%; margin:0;" onclick="fakeProcess()">VERIFY PAYMENT</button>
        <div id="loading-overlay" class="loading-overlay">
            <i class="fas fa-sync fa-spin" style="font-size: 40px; color: gold;"></i>
            <p style="margin-top: 10px;">Verifying...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";
        let isLocked = true;
        const LOCK_TIME = 180000; // 3 Minutes
        let lastPeriod = null;
        let currentPrediction = null; // 'BIG' or 'SMALL'

        // ===== VIDEO PLAYER LOGIC =====
        function playPredictionVideo(prediction) {
            const video = document.getElementById('prediction-video-bg');
            const source = document.getElementById('video-source');

            const newSrc = prediction === 'BIG' ? 'big.mp4' : 'small.mp4';

            if (source.src !== newSrc && !source.src.endsWith(newSrc)) {
                source.src = newSrc;
                video.load();
            }
            video.play().catch(() => {});
        }

        // ===== FETCH LIVE PERIOD =====
        async function fetchLivePeriod() {
            try {
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                const data = await response.json();
                if (data && data.data && data.data.list && data.data.list.length > 0) {
                    const latestIssue = data.data.list[0].issueNumber;
                    const nextPeriod = (BigInt(latestIssue) + 1n).toString();

                    // Update period display
                    document.getElementById('game-period-display').innerText = '#' + nextPeriod;

                    // Auto-change prediction when period changes
                    if (lastPeriod !== null && lastPeriod !== nextPeriod) {
                        // New period detected — auto generate new prediction
                        if (!isLocked) {
                            generatePrediction();
                        }
                    }
                    lastPeriod = nextPeriod;
                }
            } catch (e) { console.error("API Error"); }
        }

        // ===== GENERATE PREDICTION =====
        function generatePrediction() {
            if (isLocked) return;

            const resultText = document.getElementById('pred-result-text');
            resultText.innerText = "...";
            resultText.className = 'pred-result-value analyzing-pulse';

            setTimeout(() => {
                const sizes = ["BIG", "SMALL"];
                const selected = sizes[Math.floor(Math.random() * sizes.length)];
                currentPrediction = selected;

                resultText.innerText = selected;
                resultText.classList.remove('analyzing-pulse');

                if (selected === 'BIG') {
                    resultText.className = 'pred-result-value big';
                } else {
                    resultText.className = 'pred-result-value small';
                }

                // Play matching video
                playPredictionVideo(selected);

                fetchLivePeriod();
            }, 600);
        }

        // ===== DRAG LOGIC for Floating Circle =====
        const floatBtn = document.getElementById('floating-circle');
        let isDragging = false, xOffset = 0, yOffset = 0, initialX, initialY;

        floatBtn.addEventListener("touchstart", (e) => {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
            isDragging = false;
        });
        floatBtn.addEventListener("touchmove", (e) => {
            isDragging = true; e.preventDefault();
            const currentX = e.touches[0].clientX - initialX;
            const currentY = e.touches[0].clientY - initialY;
            xOffset = currentX; yOffset = currentY;
            floatBtn.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        });
        floatBtn.addEventListener("click", () => { if (!isDragging) toggleMickeyPanel(); });

        // ===== START APP =====
        function startApp() {
            document.getElementById('game-frame').src = "https://bdg6742.com//#/register?invitationCode=6675221212113";
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('game-frame').style.display = 'block';
            document.getElementById('floating-circle').style.display = 'flex';

            fetchLivePeriod();
            setInterval(fetchLivePeriod, 2000);

            // Unlock after lock time
            setTimeout(() => {
                isLocked = false;
                const panel = document.getElementById('prediction-result-panel');
                if (panel.style.display === 'block') {
                    generatePrediction();
                }
            }, LOCK_TIME);
        }

        // ===== TOGGLE PANEL =====
        function toggleMickeyPanel() {
            const panel = document.getElementById('prediction-result-panel');
            const resultText = document.getElementById('pred-result-text');

            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                // Pause video when hidden
                document.getElementById('prediction-video-bg').pause();
            } else {
                panel.style.display = 'block';
                panel.classList.add('show');

                if (isLocked) {
                    resultText.innerText = 'LOCKED';
                    resultText.className = 'pred-result-value small';
                    // Play default small video
                    playPredictionVideo('SMALL');
                } else {
                    generatePrediction();
                }
                fetchLivePeriod();
            }
        }

        // ===== PAYMENT =====
        function openPayment() { document.getElementById('payment-box').style.display = 'block'; }
        function fakeProcess() {
            if (document.getElementById('utr').value.length < 10) { alert("Invalid UTR!"); return; }
            document.getElementById('loading-overlay').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('payment-box').style.display = 'none';
                alert("Suresort Active!");
            }, 3000);
        }
    </script>
</body>
</html>
